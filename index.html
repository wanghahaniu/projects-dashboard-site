<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="我的个人网站与智能分析工具集合。">
<title>我的网站看板</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%235aa7ff%22/><path d=%22M25 50h50M50 25v50%22 stroke=%22white%22 stroke-width=%2210%22 stroke-linecap=%22round%22/></svg>">
<style>
:root {
  --bg: #0a0a0f;
  --bg-soft: #10111a;
  --card: #141620;
  --card-hover: #191b28;
  --border: #282b3b;
  --text: #f0f1f6;
  --muted: #9ca2b5;
  --faint: #62697e;
  --blue: #5aa7ff;
  --purple: #a78bfa;
  --radius: 14px;
}
* { box-sizing: border-box; }
html { min-height: 100%; }
body {
  min-height: 100vh;
  margin: 0;
  color: var(--text);
  background:
    radial-gradient(circle at 15% 0%, rgba(90,167,255,.12), transparent 30rem),
    radial-gradient(circle at 90% 15%, rgba(167,139,250,.1), transparent 28rem),
    var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
a { color: inherit; }
.page { width: min(1160px, calc(100% - 40px)); margin: 0 auto; padding: 72px 0 36px; }
.hero { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 44px; }
.eyebrow { color: var(--blue); font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
h1 { margin: 12px 0 10px; font-size: clamp(34px, 5vw, 56px); letter-spacing: -1.5px; line-height: 1.1; }
.subtitle { max-width: 580px; margin: 0; color: var(--muted); font-size: 16px; line-height: 1.75; }
.count { flex: 0 0 auto; padding: 10px 14px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; background: rgba(20,22,32,.75); font-size: 13px; }
.count strong { color: var(--text); font-size: 18px; margin-right: 5px; }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.card {
  --accent: var(--blue);
  position: relative; display: flex; flex-direction: column; min-height: 344px; padding: 24px;
  overflow: hidden; border: 1px solid var(--border); border-radius: var(--radius); background: rgba(20,22,32,.9);
  transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease, background .2s ease;
}
.card::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--accent); }
.card:hover { transform: translateY(-5px); border-color: color-mix(in srgb, var(--accent) 65%, var(--border)); background: var(--card-hover); box-shadow: 0 16px 36px rgba(0,0,0,.28); }
.card:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.icon { display: grid; place-items: center; width: 52px; height: 52px; flex: 0 0 52px; border-radius: 13px; color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); font-size: 25px; }
.status { padding: 5px 8px; color: #63e6a4; border: 1px solid rgba(99,230,164,.22); border-radius: 999px; background: rgba(99,230,164,.08); font-size: 11px; white-space: nowrap; }
.category { margin: 24px 0 8px; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }
h2 { margin: 0; font-size: 21px; line-height: 1.45; }
.description { min-height: 74px; margin: 12px 0 18px; color: var(--muted); font-size: 14px; line-height: 1.75; }
.tags { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 24px; }
.tag { padding: 5px 9px; color: var(--faint); border: 1px solid var(--border); border-radius: 5px; font-size: 11px; }
.actions { display: flex; gap: 9px; margin-top: auto; }
.button { display: inline-flex; min-height: 40px; align-items: center; justify-content: center; flex: 1; padding: 0 12px; border: 1px solid var(--border); border-radius: 7px; font-size: 13px; font-weight: 600; text-decoration: none; transition: border-color .2s, background .2s, color .2s; }
.button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.button.primary { color: #08101c; border-color: var(--accent); background: var(--accent); }
.button.primary:hover { filter: brightness(1.1); }
.button.secondary { color: var(--muted); background: rgba(255,255,255,.02); }
.button.secondary:hover { color: var(--text); border-color: var(--accent); }
footer { margin-top: 54px; padding-top: 18px; color: var(--faint); border-top: 1px solid var(--border); font-size: 12px; text-align: center; }
@media (max-width: 900px) { .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) { .page { width: min(100% - 28px, 480px); padding-top: 42px; } .hero { display: block; margin-bottom: 30px; } .count { display: inline-block; margin-top: 20px; } .cards { grid-template-columns: 1fr; } .card { min-height: 0; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }
</style>
</head>
<body>
<main class="page">
  <header class="hero">
    <div>
      <div class="eyebrow">PERSONAL PROJECTS</div>
      <h1>我的网站看板</h1>
      <p class="subtitle">把做过的工具集中在这里。一个入口，快速回到每个分析工作台。</p>
    </div>
    <div class="count"><strong>09</strong> 个网站</div>
  </header>

  <section class="cards" id="project-cards" aria-label="我的网站列表"></section>
  <footer>持续构建中 · 我的个人工具集合</footer>
</main>

    tags: ['风险分析', '宏观推演', 'AI'], status: '已上线',

    tags: ['事实核查', 'OCR', '多源验证'], status: '已上线',
    siteUrl: 'https://wanghahaniu.github.io/factcheck/', repoUrl: 'https://github.com/wanghahaniu/factcheck'

  },

    tags: ['期货', '强度排行', '实时监控'], status: '在线',

  },
  {

    tags: ['纳斯达克', '美股', '排行榜'], status: '在线',

  }
];

const cards = document.querySelector('#project-cards');
cards.innerHTML = projects.map(project => `
  <article class="card" style="--accent: ${project.accent}">
    <div class="card-head"><div class="icon" aria-hidden="true">${project.icon}</div><span class="status">● ${project.status}</span></div>
    <div class="category">${project.category}</div>
    <h2>${project.name}</h2>
    <p class="description">${project.description}</p>
    <div class="tags">${project.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>
    <div class="actions">
      <a class="button primary" href="${project.siteUrl}" target="_blank" rel="noopener noreferrer">打开网站 ↗</a>
      ${project.repoUrl ? `<a class="button secondary" href="${project.repoUrl}" target="_blank" rel="noopener noreferrer">查看源码</a>` : '<span class="button secondary" aria-disabled="true">暂无源码</span>'}
    </div>
  </article>
`).join('');
</script>
</body>
</html>
